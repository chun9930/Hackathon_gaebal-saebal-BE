plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mcm'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'com.google.genai:google-genai:1.66.0'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'spring.profiles.active', 'test'
}

tasks.register('mysqlVerificationTest', Test) {
	group = 'verification'
	description = 'Runs integration tests with application.yaml and MySQL environment variables.'
	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	def mysqlJdbcUrl = providers.environmentVariable('MYSQL_JDBC_URL')
	def mysqlUsername = providers.environmentVariable('MYSQL_USERNAME')
	def mysqlPassword = providers.environmentVariable('MYSQL_PASSWORD')
	if (mysqlJdbcUrl.present) systemProperty 'DB_URL', mysqlJdbcUrl.get()
	if (mysqlUsername.present) systemProperty 'DB_USERNAME', mysqlUsername.get()
	if (mysqlPassword.present) systemProperty 'DB_PASSWORD', mysqlPassword.get()
	systemProperty 'H2_CONSOLE_ENABLED', 'false'
	systemProperty 'JPA_DDL_AUTO', 'create-drop'
	systemProperty 'MOCK_SEED_ENABLED', 'false'
	systemProperty 'EMPLOYEE_SEED_ENABLED', 'false'
	shouldRunAfter tasks.named('test')
}
